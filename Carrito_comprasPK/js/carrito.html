<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora PK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/main.css">

</head>

<body>

    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo"> DISTRIBUIDORA RIVEKOL SAC </h1>
            </header>
            <nav>
                <ul>
                    <li>
                        <a href="../js/index.html"> <button class="boton-menu boton-volver">
                                <i class="bi bi-arrow-left"></i>Seguir comprando</button>
                        </a>
                    </li>
                    <li>
                        <a href="../js/carrito.html"><button class="boton-menu boton-carrito">
                            <i class="bi bi-cart-fill"></i>Carrito </button>
                    </a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© 2023 SixterVega </p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal">Carrito</h2>
            <div class="contenedor-carrito">
                <p id="carrito-vacio" class="carrito-vacio">Tu carrito esta vacio <i class="bi bi-emoji-frown"></i></p>
                
                <div id="carrito-productos" class="carrito-productos disabled">

                <!--Esto se completara con el JS-->

                </div>

                <div id="carrito-acciones" class="carrito-acciones disabled">
                    <div class="carrito-acciones-izquierda">
                        <button id="carrito-acciones-vaciar" class="carrito-acciones-vaciar">Vaciar carrito</button>
                    </div>
                    <div class="carrito-acciones-derecha">
                        <div class="carrito-acciones-total">
                            <p>Total:</p>
                            <p id="total">S/. 3000</p>
                        </div>
                        <button id="carrito-acciones-comprar" class="carrito-acciones-comprar">Comprar ahora</button>
                    </div>
                </div>

                <p id="carrito-comprado" class="carrito-comprado disabled">Muchas gracias por tu compra <i class="bi bi-emoji-grin"></i></p>

            </div>

        </main>
    </div>
<script src="../js/carrito.js"></script>

</body>

</html>
